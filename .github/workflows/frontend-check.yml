name: Frontend Check

on:
  pull_request:
    paths:
      - "client-extensions/nexcent-landing-elements/**"
      - "client-extensions/nexcent-theme/**"
      - ".github/workflows/frontend-check.yml"
  push:
    branches:
      - main
    paths:
      - "client-extensions/nexcent-landing-elements/**"
      - "client-extensions/nexcent-theme/**"
      - ".github/workflows/frontend-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-contracts:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client-extensions/nexcent-landing-elements

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Fragment data source contracts
        run: node scripts/validate-data-sources.mjs

      - name: Validate production import boundaries
        run: node scripts/validate-no-prototype-imports.mjs

  typecheck-and-build:
    needs: validate-contracts
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client-extensions/nexcent-landing-elements

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Build React Client Extension
        run: npm run build

      - name: Package Nexcent Fragment Set
        run: npm run package:fragments

      - name: Verify deterministic frontend output
        run: |
          test -f build/index.js
          test -s build/fragments/collections-nexcent-components.zip
          jar --list --file build/fragments/collections-nexcent-components.zip | grep -q 'nexcent-components/collection.json'
          jar --list --file build/fragments/collections-nexcent-components.zip | grep -q 'nexcent-components/fragments/nexcent-react-header/configuration.json'
          jar --list --file build/fragments/collections-nexcent-components.zip | grep -q 'nexcent-components/fragments/nexcent-react-hero/configuration.json'
          jar --list --file build/fragments/collections-nexcent-components.zip | grep -q 'nexcent-components/fragments/nexcent-react-community/configuration.json'
          jar --list --file build/fragments/collections-nexcent-components.zip | grep -q 'nexcent-components/fragments/nexcent-react-marketing/configuration.json'
          jar --list --file build/fragments/collections-nexcent-components.zip | grep -q 'nexcent-components/fragments/nexcent-react-footer/configuration.json'

      - name: Build Nexcent Theme Client Extension
        working-directory: client-extensions/nexcent-theme
        run: ../../gradlew build

      - name: Verify theme output
        working-directory: client-extensions/nexcent-theme
        run: |
          test -f assets/global-entry.css
          test -f assets/react-shell.css
          grep -q 'url: global-entry.css' client-extension.yaml
          grep -q './global.css' assets/global-entry.css
          grep -q './react-shell.css' assets/global-entry.css
